<ossec_config>
  <!-- The Wazuh 4.14 Docker agent image substitutes CHANGE_MANAGER_IP,
       CHANGE_ENROLL_IP, CHANGE_AGENT_NAME, and CHANGE_AGENT_GROUP. -->
  <client>
    <!-- Client reference: auto_restart "Toggles on and off the automatic restart of agents
         when a new valid configuration is received from the manager" (default yes).
         https://documentation.wazuh.com/4.14/user-manual/reference/ossec-conf/client.html
         The lab uses no centralized config. A restart during a replay leaves FIM blind
         for a few seconds: a file written then joins the new baseline without an alert. -->
    <auto_restart>no</auto_restart>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <authorization_pass_path>etc/authd.pass</authorization_pass_path>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>
  </client>
  <syscheck>
    <!-- The syscheck reference says "The realtime attribute enables real-time/continuous monitoring
         of directories": https://documentation.wazuh.com/4.14/user-manual/capabilities/file-integrity/basic-settings.html -->
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <alert_new_files>yes</alert_new_files>
    <directories check_all="yes" realtime="yes">/var/www/html</directories>
  </syscheck>
  <!-- localfile/log_format reference: "apache" is documented for Apache logs only, and
       "For most text log files with one entry per line, use the syslog format".
       https://documentation.wazuh.com/4.14/user-manual/reference/ossec-conf/localfile.html -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>
</ossec_config>
