services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab-only-password
      MYSQL_ROOT_PASSWORD: lab-root-only-password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/001-seed.sql:ro
    networks:
      - lab-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plab-root-only-password"]
      interval: 3s
      timeout: 3s
      retries: 30

  php:
    build:
      context: ./php
    environment:
      DB_HOST: mysql
      DB_NAME: lab
      DB_USER: lab
      DB_PASSWORD: lab-only-password
      TZ: UTC
    volumes:
      - ./app:/opt/app-source:ro
      - webroot:/var/www/html
      - ./logs:/var/log/nginx:ro
      - ../scripts/collect.sh:/opt/collect.sh:ro
    command: ["sh", "-c", "cp -R /opt/app-source/. /var/www/html/ && chown -R www-data:www-data /var/www/html/uploads /var/www/html/cache && exec php-fpm"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lab-internal

  nginx:
    image: nginx:1.27-alpine
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - webroot:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - php
    networks:
      lab-internal: {}
      host-access:
        ipv4_address: 172.30.0.2

  edge:
    image: nginx:1.27-alpine
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/edge-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nginx
    networks:
      host-access:
        ipv4_address: 172.30.0.3

networks:
  lab-internal:
    internal: true
  host-access:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  mysql-data:
  webroot:
