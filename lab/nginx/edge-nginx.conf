worker_processes auto;

events {
    worker_connections 128;
}

http {
    map $http_x_lab_client_ip $lab_forwarded_for {
        ""      $remote_addr;
        default $http_x_lab_client_ip;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $lab_forwarded_for;
            proxy_pass http://nginx:80;
        }
    }
}
