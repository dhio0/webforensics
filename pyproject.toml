[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "webforensics"
version = "0.1.0"
description = "Reconstruct how a website was compromised by correlating webroot file evidence with web server logs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dhio" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.6,<3",
    # PHP parsing for code localization (M7); both MIT, prebuilt wheels, no compiler needed.
    "tree-sitter>=0.25,<1",
    "tree-sitter-php>=0.24,<1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.21",
    "pytest>=8",
    "ruff>=0.6",
]
lab = ["cryptography==50.0.2"]

[project.scripts]
webforensics = "webforensics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/webforensics"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "lab: needs the docker lab running (not run in CI)",
]
