<style>/* webforensics viewer. Quiet on purpose: white space, thin rules, one signal colour (red)

:root{
--bg:#ffffff;--soft:#f6f7f8;--ink:#16181d;--ink-2:#454b54;--muted:#6b717b;
--rule:#e4e6e9;--rule-2:#cfd3d8;
--red:#c42b1c;--red-soft:#fbeeed;--sel:#f1f3f5;
--high:#2f7d4f;--medium:#9a6b00;--low:#c42b1c;
--c-recon:#7b8794;--c-exploit:#c42b1c;--c-login:#8a6d1f;--c-write:#5b4a8a;
--c-file:#2d6f6a;--c-use:#4a6b3a;--c-other:#9aa1aa;
--gap:#eef0f2;
--sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,sans-serif;
--mono:"Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
color-scheme:light}
@media (prefers-color-scheme:dark){:root{
--bg:#131416;--soft:#1a1c1f;--ink:#e8e9eb;--ink-2:#b9bdc3;--muted:#8a9099;
--rule:#26292d;--rule-2:#363a40;
--red:#ff6b5e;--red-soft:#2a1716;--sel:#1e2124;
--high:#6cc48e;--medium:#d9b25a;--low:#ff6b5e;
--c-recon:#8d99a6;--c-exploit:#ff6b5e;--c-login:#cfae5c;--c-write:#a596d6;
--c-file:#6fb7af;--c-use:#93b87f;--c-other:#7d838c;
--gap:#1c1f22;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration-color:var(--rule-2);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 72px}
.label{font-size:.75rem;color:var(--muted)}

/* header */
.cover{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 32px;flex-wrap:wrap}
.cover h1{font-size:1.6rem;font-weight:600;line-height:1.25;margin:2px 0 0;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:10px;font-size:.82rem;color:var(--muted)}
.meta div{display:flex;gap:6px}
.meta span:last-child{color:var(--ink-2);font-family:var(--mono);font-size:.8rem}
.stamp{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;color:var(--red);
padding-top:6px;white-space:nowrap}
.stamp::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.stamp.clean{color:var(--high)}

/* main finding */
.finding{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 48px;align-items:end;
margin-top:28px;padding:22px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.entry{margin:6px 0 6px;font-size:1.15rem;line-height:1.45;overflow-wrap:anywhere}
.entry .n{font-family:var(--mono);font-size:.95rem;color:var(--red);margin-right:8px;text-decoration:none}
.entry .when{font-family:var(--mono);font-size:.85rem;color:var(--muted);margin-right:8px}
.entry-sub{margin:0;color:var(--ink-2);font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.ledger{display:flex;gap:32px;margin:0}
.ledger div{display:flex;flex-direction:column-reverse;gap:2px}
.ledger dd{margin:0;font-size:1.6rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}

/* confidence */
.meter{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;white-space:nowrap;color:var(--ink-2)}
.meter i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.c-high i{background:var(--high)}.c-medium i{background:var(--medium)}.c-low i{background:var(--low)}

/* tabs */
nav.tabs{display:flex;gap:4px;margin:28px 0 24px;overflow-x:auto;border-bottom:1px solid var(--rule)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
padding:8px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-size:.92rem}
nav.tabs button .i{display:none}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
nav.tabs button:focus-visible{outline:2px solid var(--ink-2);outline-offset:-2px}

/* static sections */
.sheet{margin-bottom:36px}
section.doc h2{font-size:1.15rem;font-weight:600;margin:0 0 12px}
section.doc h3{font-size:.85rem;font-weight:600;color:var(--ink-2);margin:24px 0 8px}
section.doc p,section.doc ul{margin:6px 0}
section.doc ul{padding-left:20px}
section.doc li{margin:4px 0;overflow-wrap:anywhere}
section.doc li::marker{color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-weight:600;font-size:.78rem;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule-2)}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top;overflow-wrap:anywhere}
tr.hl td{background:var(--red-soft)}
td.mark-root{font-weight:600}
dl.fields{display:grid;grid-template-columns:max-content 1fr;gap:6px 28px;margin:8px 0}
dl.fields dt{color:var(--muted);font-size:.85rem}
dl.fields dd{margin:0;overflow-wrap:anywhere}
pre{font:.8rem/1.6 var(--mono);background:var(--soft);border-radius:4px;padding:10px 12px;margin:8px 0;
white-space:pre-wrap;overflow-wrap:anywhere}

/* timeline */
.tl{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:36px;align-items:start}
.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.chart-head h2{font-size:1.05rem;font-weight:600;margin:0}
.hint{color:var(--muted);font-size:.85rem;margin:2px 0 12px}
.chart svg{display:block;width:100%;touch-action:none;user-select:none}
.chart .lane{font:11px var(--mono);fill:var(--muted)}
.chart .lane.att{fill:var(--ink)}
.chart .axis{font:10px var(--mono);fill:var(--muted)}
.chart .base{stroke:var(--rule);stroke-width:1}
.chart .tick{stroke:var(--rule);stroke-width:1}
.chart .gapband{fill:var(--gap)}
.chart .hatchline{stroke:none}
.chart .gaplabel{font:9px var(--mono);fill:var(--muted)}
.chart .ev{cursor:pointer}
.chart .ev.sel{stroke:var(--ink);stroke-width:2}
.chart .rootline{stroke:var(--red);stroke-width:1;stroke-dasharray:2 3}
.chart .roottagbg{display:none}
.chart .roottag{font:10px var(--mono);fill:var(--red)}
.chart .brush{fill:var(--ink);opacity:.06}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.btn{border:1px solid var(--rule-2);background:var(--bg);border-radius:4px;padding:2px 10px;cursor:pointer;
font-size:.8rem;white-space:nowrap;flex-shrink:0;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-2);color:var(--ink)}

/* glyphs: a shape per kind, so colour is never the only cue */
.g{display:inline-block;width:9px;height:9px;flex-shrink:0}
.g-recon{border:1.5px solid var(--c-recon);border-radius:50%}
.g-exploit{background:var(--c-exploit);clip-path:polygon(50% 0,100% 100%,0 100%)}
.g-login{background:var(--c-login);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.g-write{background:var(--c-write)}
.g-file{border:1.5px solid var(--c-file)}
.g-use{background:var(--c-use);border-radius:50%}
.g-other{background:var(--c-other);width:5px;height:5px;margin:2px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:28px 0 4px}
.filters input[type=search]{flex:1 1 220px;min-width:0;padding:6px 10px;border:1px solid var(--rule-2);
border-radius:4px;background:var(--bg)}
.filters input[type=search]:focus,.filters select:focus{outline:2px solid var(--ink-2);outline-offset:-1px}
.filters select{padding:6px 8px;border:1px solid var(--rule-2);border-radius:4px;background:var(--bg);max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:3px 6px;cursor:pointer;
font-size:.82rem;color:var(--ink-2)}
.chip[aria-pressed="false"]{opacity:.35}
.toggle{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--ink-2)}
.toggle input{accent-color:var(--ink)}
.count{color:var(--muted);font-size:.8rem;margin-left:auto}

.reg-head,ol.events li{display:grid;grid-template-columns:48px 72px 124px minmax(0,1fr) 84px;
gap:12px;align-items:baseline}
.reg-head{padding:10px 8px 8px;border-bottom:1px solid var(--rule-2)}
ol.events{list-style:none;margin:0;padding:0}
ol.events li{padding:10px 8px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:.9rem}
ol.events li:hover{background:var(--soft)}
ol.events li.sel{background:var(--sel)}
ol.events li.root{box-shadow:inset 2px 0 0 var(--red)}
ol.events li.day{display:block;cursor:default;padding:18px 8px 6px;font-size:.78rem;color:var(--muted);
border-bottom:1px solid var(--rule);background:none}
ol.events li.sub{font-size:.86rem}
ol.events li.sub .n{padding-left:10px}
ol.events li.runrow .text{color:var(--ink-2)}
ol.events .n{font:.8rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
ol.events li.root .n{color:var(--red)}
ol.events .time{font:.82rem var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
ol.events .actor{font:.8rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
ol.events .text{display:flex;gap:9px;align-items:baseline;overflow-wrap:anywhere;min-width:0}
ol.events .text .g{position:relative;top:0}
ol.events .tag{font-size:.75rem;font-weight:600;color:var(--red);margin-right:6px}
ol.events li.empty{display:block;cursor:default;color:var(--muted);text-align:center;padding:28px}
.more{margin:16px 0;text-align:center}

/* detail */
.detail{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;
border-left:1px solid var(--rule);padding:0 0 16px 24px}
.detail .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:2px 0 10px}
.detail .head .no{font:600 1.1rem var(--mono);margin-top:2px}
.detail .body{padding:0}
.detail .rootnote{font-size:.8rem;font-weight:600;color:var(--red);margin-top:4px}
.detail .text{margin:10px 0 14px;font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
.detail .text .g{margin-right:4px}
.detail dl.fields{grid-template-columns:96px 1fr;font-size:.88rem}
.detail h3{font-size:.8rem;font-weight:600;color:var(--muted);margin:20px 0 6px}
.detail ul{margin:0;padding-left:18px;font-size:.88rem;color:var(--ink-2)}
.detail li{margin:4px 0}
.cite{margin:10px 0}
.cite .ref{display:flex;justify-content:space-between;align-items:center;gap:8px;font:.78rem var(--mono);
color:var(--ink-2);overflow-wrap:anywhere;margin-bottom:4px}
.cite pre{margin:0}
.detail .empty{color:var(--muted);margin:8px 0;font-size:.9rem}
.detail .close{display:none}
footer{color:var(--muted);font-size:.78rem;margin-top:48px;padding-top:14px;border-top:1px solid var(--rule)}

@media (max-width:980px){
.tl{grid-template-columns:1fr}
.detail{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:62vh;z-index:5;display:none;

.detail.open{display:block}
.detail .close{display:inline-block}
.reg-head{display:none}
ol.events li{grid-template-columns:auto auto minmax(0,1fr);

ol.events .n{grid-area:n}ol.events .time{grid-area:time}ol.events .actor{grid-area:actor}
ol.events .text{grid-area:text}ol.events li>:last-child{grid-area:conf;justify-self:end}
.finding{grid-template-columns:1fr}
}
@media (max-width:640px){
.wrap{padding:24px 16px 56px}
.cover h1{font-size:1.35rem}
.ledger{gap:20px}
.ledger dd{font-size:1.3rem}
dl.fields{grid-template-columns:1fr;gap:0}
dl.fields dd{margin-bottom:6px}
}
@media print{nav.tabs,.filters,.chart-head .btn,.detail{display:none}}

    });
    svgHost = el("div");
    var legend = el("div", { cls: "legend" });
    present().forEach(function (c) { legend.appendChild(el("span", null, glyph(c.id), c.label)); });
    var chart = el("div", { cls: "chart" },
      el("div", { cls: "chart-head" }, el("h2", { text: U["chart.title"] }), resetBtn),
      el("p", { cls: "hint", text: U["chart.hint"] }), svgHost, legend);

    var search = el("input", {
      type: "search", placeholder: U["filter.search"], "aria-label": U["filter.search"],
      oninput: function () { state.q = search.value.trim().toLowerCase(); state.limit = PAGE; refresh(); }
    });
    var actor = el("select", {
      "aria-label": U["filter.actor"],
      onchange: function () { state.actor = actor.value; state.limit = PAGE; refresh(); }
    }, el("option", { value: "*", text: U["filter.actor"] }));
    actorList().forEach(function (a) {
      actor.appendChild(el("option", { value: a, text: a || U["chart.files"] }));
    });
    var story = el("input", {
      type: "checkbox", id: "story-only",
      onchange: function () { state.story = story.checked; state.limit = PAGE; refresh(); }
    });
    countEl = el("span", { cls: "count", "aria-live": "polite" });
    var filters = el("div", { cls: "filters" }, search, actor);
    present().forEach(function (c) {
      var chip = el("button", {
        cls: "chip", "aria-pressed": "true",
        onclick: function () {
          state.cats[c.id] = !state.cats[c.id];
          chip.setAttribute("aria-pressed", state.cats[c.id] ? "true" : "false");
          state.limit = PAGE; refresh();
        }
      }, glyph(c.id), c.label);
      filters.appendChild(chip);
    });
    filters.appendChild(el("label", { cls: "toggle", for: "story-only" }, story, U["filter.story"]));
    filters.appendChild(countEl);

    var head = el("div", { cls: "reg-head", "aria-hidden": "true" },
      el("span", { cls: "label", text: U["col.n"] }),
      el("span", { cls: "label", text: U["col.time"] + " " + D.zoneShort }),
      el("span", { cls: "label", text: U["col.actor"] }),
      el("span", { cls: "label", text: U["col.event"] }),
      el("span", { cls: "label", text: U["col.confidence"] }));
    listEl = el("ol", { cls: "events" });
    moreBox = el("div", { cls: "more" });
    detailEl = el("aside", { cls: "detail", "aria-live": "polite" });
    var main = el("div", null, chart, filters, head, listEl, moreBox);
    panel.appendChild(el("div", { cls: "tl" }, main, detailEl));
    renderDetail();
    renderList();

    if (window.ResizeObserver) {
      var pending = null;
      new ResizeObserver(function () {
        if (pending) cancelAnimationFrame(pending);
        pending = requestAnimationFrame(function () { if (state.tab === "timeline") drawChart(); });
      }).observe(svgHost);
    }
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") detailEl.classList.remove("open");
    });
  }

  function present() {
    return D.categories.filter(function (c) {
      return events.some(function (e) { return e.cat === c.id; });
    });
  }

  function actorList() {
    var seen = {}, out = [];
    D.lanes.concat(events.map(function (e) { return e.actor; })).forEach(function (a) {
      if (!seen[a]) { seen[a] = true; out.push(a); }
    });
    return out;
  }

  function matches(e) {
    if (!state.cats[e.cat]) return false;
    if (state.actor !== "*" && e.actor !== state.actor) return false;
    if (state.story && !(e.story || e.root)) return false;
    if (state.zoom && (e.ms < state.zoom[0] || e.ms > state.zoom[1])) return false;
    if (state.q && e.search.indexOf(state.q) < 0) return false;
    return true;
  }

  function refresh() {
    resetBtn.hidden = !state.zoom;
    drawChart();
    renderList();
  }

  // One SVG mark per event: the shape says what kind of event it is.
  function mark(cat, x, y, root) {
    var r = root ? 6.5 : 5, color = "var(--c-" + cat + ")", node;
    if (cat === "recon") node = sv("circle", { cx: x, cy: y, r: r - 1, fill: "var(--bg)", stroke: color, "stroke-width": 2 });
    else if (cat === "exploit") node = sv("polygon", { points: [x, y - r - 1, x + r + 1, y + r, x - r - 1, y + r].join(" "), fill: color });
    else if (cat === "login") node = sv("polygon", { points: [x, y - r - 1, x + r + 1, y, x, y + r + 1, x - r - 1, y].join(" "), fill: color });
    else if (cat === "write") node = sv("rect", { x: x - r + 0.5, y: y - r + 0.5, width: 2 * r - 1, height: 2 * r - 1, fill: color });
    else if (cat === "file") node = sv("rect", { x: x - r + 1, y: y - r + 1, width: 2 * r - 2, height: 2 * r - 2, fill: "var(--bg)", stroke: color, "stroke-width": 2 });
    else if (cat === "use") node = sv("circle", { cx: x, cy: y, r: r - 0.5, fill: color });
    else node = sv("circle", { cx: x, cy: y, r: 2.5, fill: color });
    return node;
  }

  function drawChart() {
    if (!svgHost || state.tab !== "timeline") return;
    if (!events.length) {
      svgHost.textContent = "";
      svgHost.appendChild(el("p", { cls: "hint", text: U["chart.empty"] }));
      return;
    }
    var width = Math.max(320, svgHost.clientWidth || 800);
    var left = width < 520 ? 96 : 138, right = 16, top = 20, laneH = 28, axisH = 24;
    var lanes = D.lanes.slice();
    var othersLane = hasOthers ? lanes.length : -1;
    var laneCount = lanes.length + (hasOthers ? 1 : 0);
    var plotH = laneCount * laneH;
    var height = top + plotH + axisH;
    var shown = events.filter(matches);
    var lo = state.zoom ? state.zoom[0] : events[0].ms;
    var hi = state.zoom ? state.zoom[1] : events[events.length - 1].ms;
    if (hi - lo < 10000) { var mid = (hi + lo) / 2; lo = mid - 5000; hi = mid + 5000; }
    var pad = state.zoom ? 0 : (hi - lo) * 0.04;
    lo -= pad; hi += pad;
    var plotW = width - left - right;
    function x(ms) { return left + (ms - lo) / (hi - lo) * plotW; }

    var svg = sv("svg", { viewBox: "0 0 " + width + " " + height, height: height, role: "img",
      "aria-label": U["chart.title"] });
    var defs = sv("defs", {});
    var hatch = sv("pattern", { id: "hatch", patternUnits: "userSpaceOnUse", width: 6, height: 6,
      patternTransform: "rotate(45)" });
    hatch.appendChild(sv("line", { "class": "hatchline", x1: 0, y1: 0, x2: 0, y2: 6 }));
    defs.appendChild(hatch);
    svg.appendChild(defs);

    D.gaps.forEach(function (g) {
      if (g.to < lo || g.from > hi) return;
      var x0 = x(Math.max(g.from, lo)), x1 = x(Math.min(g.to, hi));
      var band = sv("rect", { "class": "gapband", x: x0, y: top, width: Math.max(2, x1 - x0),
        height: plotH, fill: "url(#hatch)" });
      band.appendChild(titleNode(g.label + " · " + g.kind));
      svg.appendChild(band);
      if (x1 - x0 > 18) {
        var gl = sv("text", { "class": "gaplabel", x: x0 + 3, y: top - 6 });
        gl.textContent = g.label;
        svg.appendChild(gl);
      }
    });
    ticks(lo, hi).forEach(function (t) {
      var tx = x(t.ms);
      svg.appendChild(sv("line", { "class": "tick", x1: tx, x2: tx, y1: top, y2: top + plotH + 4 }));
      var tl = sv("text", { "class": "axis", x: tx, y: top + plotH + 16, "text-anchor": "middle" });
      tl.textContent = t.label;
      svg.appendChild(tl);
    });
    for (var i = 0; i < laneCount; i++) {
      var y = top + i * laneH + laneH / 2;
      svg.appendChild(sv("line", { "class": "base", x1: left, x2: width - right, y1: y, y2: y }));
      var name = i === othersLane ? U["chart.others"] : (lanes[i] || U["chart.files"]);
      var label = sv("text", { "class": "lane" + (attacker[lanes[i]] ? " att" : ""), x: left - 10,
        y: y + 4, "text-anchor": "end" });
      label.textContent = name.length > 17 ? name.slice(0, 16) + "…" : name;
      label.appendChild(titleNode(name));
      svg.appendChild(label);
    }

    var root = events.filter(function (e) { return e.root; })[0];
    if (root && root.ms >= lo && root.ms <= hi && matches(root)) {
      var rx = x(root.ms);
      svg.appendChild(sv("line", { "class": "rootline", x1: rx, x2: rx, y1: top - 4, y2: top + plotH }));
      var tagText = U["chart.root"].toUpperCase() + " " + no(root.n);
      var tagW = tagText.length * 6.2 + 8, tagX = Math.min(rx, width - right - tagW);
      svg.appendChild(sv("rect", { "class": "roottagbg", x: tagX, y: top - 19, width: tagW, height: 14 }));
      var tag = sv("text", { "class": "roottag", x: tagX + 4, y: top - 8 });
      tag.textContent = tagText;
      svg.appendChild(tag);
    }

    var brush = sv("rect", { "class": "brush", x: 0, y: top, width: 0, height: plotH, visibility: "hidden" });
    svg.appendChild(brush);
    marks = {};
    shown.forEach(function (e) {
      var lane = e.actor in laneOf ? laneOf[e.actor] : othersLane;
      var node = mark(e.cat, x(e.ms), top + lane * laneH + laneH / 2, e.root);
      node.setAttribute("class", "ev" + (state.sel === e.n ? " sel" : ""));
      node.appendChild(titleNode(no(e.n) + " " + e.clock + " · " + (e.actor || U["chart.files"]) + "\n" + e.text));
      node.addEventListener("click", function (ev) { ev.stopPropagation(); select(e.n, true); });
      marks[e.n] = node;
      svg.appendChild(node);
    });

    // Drag across the chart to zoom into that time range.
    var start = null;
    function px(ev) {
      var r = svg.getBoundingClientRect();
      return (ev.clientX - r.left) * (width / r.width);
    }
    svg.addEventListener("pointerdown", function (ev) {
      if (ev.target.getAttribute && /\bev\b/.test(ev.target.getAttribute("class") || "")) return;
      var p = px(ev);
      if (p < left || p > width - right) return;
      start = p;
      svg.setPointerCapture(ev.pointerId);
      brush.setAttribute("visibility", "visible");
      brush.setAttribute("x", p); brush.setAttribute("width", 0);
    });
    svg.addEventListener("pointermove", function (ev) {
      if (start === null) return;
      var p = Math.min(Math.max(px(ev), left), width - right);
      brush.setAttribute("x", Math.min(start, p));
      brush.setAttribute("width", Math.abs(p - start));
    });
    svg.addEventListener("pointerup", function (ev) {
      if (start === null) return;
      var p = Math.min(Math.max(px(ev), left), width - right);
      var a = Math.min(start, p), b = Math.max(start, p);
      start = null;
      brush.setAttribute("visibility", "hidden");
      if (b - a < 6) return;
      function t(v) { return lo + (v - left) / plotW * (hi - lo); }
      state.zoom = [t(a), t(b)];
      state.limit = PAGE;
      refresh();
    });

    svgHost.textContent = "";
    svgHost.appendChild(svg);
  }

  function titleNode(text) {
    var t = document.createElementNS(SVGNS, "title");
    t.textContent = text;
    return t;
  }

  var STEPS = [1, 5, 15, 30, 60, 300, 900, 1800, 3600, 10800, 21600, 43200, 86400, 604800]
    .map(function (s) { return s * 1000; });

  function ticks(lo, hi) {
    var span = hi - lo, step = STEPS[STEPS.length - 1];
    for (var i = 0; i < STEPS.length; i++) { if (span / STEPS[i] <= 6) { step = STEPS[i]; break; } }
    var off = D.offsetMin * 60000, out = [];
    var first = Math.ceil((lo + off) / step) * step - off;
    var multiDay = span > 86400000;
    for (var ms = first; ms <= hi; ms += step) {
      var d = new Date(ms + off);
      var hm = pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes());
      if (step < 60000) hm += ":" + pad2(d.getUTCSeconds());
      var label = multiDay ? pad2(d.getUTCDate()) + "/" + pad2(d.getUTCMonth() + 1) + (step < 86400000 ? " " + hm : "") : hm;
      out.push({ ms: ms, label: label });
    }
    return out;
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  // Register: bursts from one actor collapse into one row until opened.
  function visibleRows() {
    var out = [], seenRun = {};
    events.forEach(function (e) {
      if (!matches(e)) return;
      if (e.run === null || state.open[e.run]) { out.push({ e: e, sub: e.run !== null }); return; }
      if (seenRun[e.run]) return;
      seenRun[e.run] = true;
      out.push({ run: e.run, e: e });
    });
    return out;
  }

  function renderList() {
    var all = visibleRows();
    var total = events.filter(matches).length;
    countEl.textContent = fmt(U["filter.count"], { shown: total, total: events.length });
    listEl.textContent = "";
    rows = {};
    if (!all.length) listEl.appendChild(el("li", { cls: "empty", text: U["filter.none"] }));
    var openedRun = {}, day = null;
    all.slice(0, state.limit).forEach(function (r) {
      if (r.e.day !== day) {
        day = r.e.day;
        listEl.appendChild(el("li", { cls: "day", text: day }));
      }
      if (r.run !== undefined) { listEl.appendChild(runRow(r.run, false)); return; }
      if (r.sub && !openedRun[r.e.run]) { openedRun[r.e.run] = true; listEl.appendChild(runRow(r.e.run, true)); }
      listEl.appendChild(eventRow(r.e, r.sub));
    });
    moreBox.textContent = "";
    if (all.length > state.limit) {
      moreBox.appendChild(el("button", {
        cls: "btn", text: fmt(U["filter.more"], { count: Math.min(PAGE, all.length - state.limit) }),
        onclick: function () { state.limit += PAGE; renderList(); }
      }));
    }
  }

  function runRow(id, opened) {
    var run = D.runs[id], first = byN[run.first];
    var toggle = function () { state.open[id] = !state.open[id]; renderList(); };
    return el("li", {
      cls: "runrow", tabindex: "0", role: "button", "aria-expanded": opened ? "true" : "false",
      onclick: toggle,
      onkeydown: function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); } }
    },
      el("span", { cls: "n", text: no(run.first) }),
      el("span", { cls: "time", text: run.clock }),
      el("span", { cls: "actor", text: first.actor || D.labels.noActor }),
      el("span", { cls: "text" }, glyph(first.cat), el("span", { text: run.text })),
      el("span", null, el("span", { cls: "btn", text: opened ? U["run.collapse"] : fmt(U["run.expand"], { count: run.count }) })));
  }

  function eventRow(e, sub) {
    var cls = [sub ? "sub" : "", e.root ? "root" : "", state.sel === e.n ? "sel" : ""].join(" ").trim();
    var text = el("span", null, e.root ? el("span", { cls: "tag", text: D.labels.rootMarker }) : null, e.text);
    var li = el("li", {
      cls: cls || null, tabindex: "0", "data-n": String(e.n),
      onclick: function () { select(e.n, false); },
      onkeydown: function (ev) { onRowKey(ev, e.n); }
    },
      el("span", { cls: "n", text: no(e.n) }),
      el("span", { cls: "time", text: e.clock }),
      el("span", { cls: "actor", text: e.actor || D.labels.noActor }),
      el("span", { cls: "text" }, glyph(e.cat), text),
      el("span", null, meter(e.conf, e.confLabel)));
    rows[e.n] = li;
    return li;
  }

  function onRowKey(ev, n) {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n, false); return; }
    if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
    ev.preventDefault();
    var items = Array.prototype.slice.call(listEl.querySelectorAll("li[tabindex]"));
    var i = items.indexOf(ev.currentTarget) + (ev.key === "ArrowDown" ? 1 : -1);
    if (items[i]) items[i].focus();
  }

  // Selecting from the chart or the finding may need to open a burst, clear filters that
  // hide the event, or show more rows before the row exists.
  function select(n, reveal) {
    var e = byN[n];
    if (!e) return;
    state.sel = n;
    if (reveal) {
      if (!matches(e)) {
        state.q = ""; state.actor = "*"; state.story = false; state.zoom = null;
        D.categories.forEach(function (c) { state.cats[c.id] = true; });
        syncFilterControls();
        drawChart();
      }
      if (e.run !== null) state.open[e.run] = true;
      var idx = visibleRows().findIndex(function (r) { return r.e === e && r.run === undefined; });
      if (idx >= state.limit) state.limit = Math.ceil((idx + 1) / PAGE) * PAGE;
    }
    renderList();
    for (var k in marks) marks[k].setAttribute("class", "ev" + (Number(k) === n ? " sel" : ""));
    renderDetail();
    detailEl.classList.add("open");
    if (rows[n] && reveal) rows[n].scrollIntoView({ block: "nearest" });
  }

  function syncFilterControls() {
    var panel = panels.timeline;
    panel.querySelector("input[type=search]").value = "";
    panel.querySelector("select").value = "*";
    panel.querySelector("#story-only").checked = false;
    Array.prototype.forEach.call(panel.querySelectorAll(".chip"), function (c) {
      c.setAttribute("aria-pressed", "true");
    });
    resetBtn.hidden = true;
  }

  function renderDetail() {
    detailEl.textContent = "";
    var e = state.sel !== null ? byN[state.sel] : null;
    var close = el("button", { cls: "btn close", text: U["detail.close"],
      onclick: function () { detailEl.classList.remove("open"); } });
    detailEl.appendChild(el("div", { cls: "head" },
      el("div", null, el("div", { cls: "label", text: U["detail.title"] }),
        el("div", { cls: "no", text: e ? no(e.n) : "—" })), close));
    if (!e) { detailEl.appendChild(el("p", { cls: "empty", text: U["detail.empty"] })); return; }
    var body = el("div", { cls: "body" });
    if (e.root) body.appendChild(el("div", { cls: "rootnote", text: U["detail.root"] }));
    body.appendChild(el("p", { cls: "text" }, glyph(e.cat), " ", e.text));
    var dl = el("dl", { cls: "fields" });
    field(dl, U["detail.time"], e.day + " " + e.clock + " " + D.zoneShort);
    field(dl, U["detail.basis"], e.basis);
    field(dl, U["detail.phase"], e.phase);
    field(dl, U["detail.actor"], e.actor || D.labels.noActor);
    field(dl, U["detail.confidence"], meter(e.conf, e.confLabel));
    body.appendChild(dl);
    if (e.notes.length) {
      body.appendChild(el("h3", { text: U["detail.notes"] }));
      var ul = el("ul");
      e.notes.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
      body.appendChild(ul);
    }
    body.appendChild(el("h3", { text: U["detail.evidence"] }));
    e.cites.forEach(function (i) {
      var c = D.cites[i];
      var btn = el("button", { cls: "btn", text: U.copy });
      btn.addEventListener("click", function () { copy(c.ref + "\n" + c.ex, btn); });
      body.appendChild(el("div", { cls: "cite" },
        el("div", { cls: "ref" }, el("span", { text: c.ref }), btn),
        c.ex ? el("pre", { text: c.ex }) : null));
    });
    detailEl.appendChild(body);
  }

  function copy(text, btn) {
    function done() { btn.textContent = U.copied; setTimeout(function () { btn.textContent = U.copy; }, 1200); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text); done(); });
    } else { fallback(text); done(); }
  }

  function fallback(text) {
    var area = el("textarea", { readonly: true, style: "position:fixed;opacity:0" });
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); } catch (err) { /* nothing else to try offline */ }
    document.body.removeChild(area);
  }

  showTab(location.hash.slice(1) || "overview", false);
})();
</script>
</body>
</html>
