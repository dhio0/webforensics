<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-LXm7fazw3TyJGvFjaNjuGzRiriLkS0W6CMQFFJa5kp4='; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Laporan Insiden Website</title>
<style>/* webforensics viewer: a security console. Layered surfaces with soft depth, one interactive
   accent (indigo), red only for the compromise and the root cause. System fonts only, so the
   page works offline. Motion runs only while the script holds a class (see playOnce). */
:root{
--bg:#f3f5f9;--surface:#ffffff;--surface-2:#f7f8fb;--ink:#0f1729;--ink-2:#3b4558;--muted:#6b7487;
--rule:#e4e8ef;--rule-2:#cfd5df;
--accent:#4f5bd5;--accent-soft:#eef0ff;--accent-ink:#ffffff;
--red:#d1342b;--red-soft:#fdeeec;--green:#1f8a5b;--green-soft:#e8f6ef;
--high:#1f8a5b;--medium:#a8770b;--low:#d1342b;
--c-recon:#6c7a8c;--c-exploit:#d1342b;--c-login:#a8770b;--c-write:#5b4fc4;
--c-file:#1f7f78;--c-use:#3f7d3a;--c-other:#9aa1ad;
--gap:#eef1f6;--sel:#eef0ff;
--sh-1:0 1px 2px rgba(15,23,41,.05),0 1px 1px rgba(15,23,41,.03);
--sh-2:0 18px 40px -18px rgba(15,23,41,.28),0 4px 10px rgba(15,23,41,.05);
--glow:rgba(79,91,213,.10);
--sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,sans-serif;
--mono:"Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
color-scheme:light}
@media (prefers-color-scheme:dark){:root{
--bg:#0a0e16;--surface:#111725;--surface-2:#161d2d;--ink:#e7ebf3;--ink-2:#b3bccc;--muted:#7c8699;
--rule:#1f2838;--rule-2:#2c374b;
--accent:#8c96ff;--accent-soft:#1b2042;--accent-ink:#0a0e16;
--red:#ff6b61;--red-soft:#2b1619;--green:#5fd09a;--green-soft:#11281f;
--high:#5fd09a;--medium:#e3b44f;--low:#ff6b61;
--c-recon:#93a1b4;--c-exploit:#ff6b61;--c-login:#e3b44f;--c-write:#a99cff;
--c-file:#5cc7bd;--c-use:#8fcf7a;--c-other:#7c8699;
--gap:#151c2b;--sel:#1b2042;
--sh-1:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.4);
--sh-2:0 24px 50px -24px rgba(0,0,0,.75),0 0 0 1px rgba(140,150,255,.08);
--glow:rgba(140,150,255,.10);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:14.5px/1.6 var(--sans);background:var(--bg);
background-image:radial-gradient(1200px 500px at 85% -10%,var(--glow),transparent 60%)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.label{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;
stroke-linejoin:round;flex-shrink:0}

/* shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px;
background:var(--surface);border-right:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:650;font-size:1.02rem;letter-spacing:-.01em}
svg.brand-ic{width:30px;height:30px;padding:6px;border-radius:9px;color:var(--accent-ink);
background:linear-gradient(140deg,var(--accent),#7b5cd6);stroke-width:2;box-shadow:0 6px 16px -6px var(--accent)}
.side-case{margin:0 4px;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--surface-2)}
.side-id{font:600 .82rem var(--mono);margin:3px 0 8px;overflow-wrap:anywhere}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;color:var(--red);
background:var(--red-soft);padding:3px 10px;border-radius:999px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.status.clean{color:var(--green);background:var(--green-soft)}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs button{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;
background:none;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink-2);font-size:.9rem;
transition:background .15s,color .15s}
nav.tabs button svg.ic{color:var(--muted);transition:color .15s,transform .2s}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button:hover svg.ic{transform:translateX(1px)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.tabs button[aria-selected="true"] svg.ic{color:var(--accent)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
border-radius:0 3px 3px 0;background:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.side-foot{margin-top:auto;padding:0 10px;font:.72rem var(--mono);color:var(--muted)}
.main{min-width:0;padding:30px 38px 64px;max-width:1260px}

/* header */
.cover{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 28px;flex-wrap:wrap}
.cover h1{font-size:1.65rem;font-weight:650;line-height:1.2;margin:4px 0 0;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:8px;font-size:.82rem;color:var(--muted)}
.meta div{display:flex;gap:6px;align-items:baseline}
.meta .label{text-transform:none;letter-spacing:0;font-weight:500;font-size:.8rem}
.meta span:last-child{color:var(--ink-2);font:.8rem var(--mono)}
.stamp{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--red);
background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 22%,transparent);
padding:6px 14px;border-radius:999px;white-space:nowrap}
.stamp::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.stamp.clean{color:var(--green);background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 22%,transparent)}

/* cards */
.card,.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--sh-1)}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;
transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;will-change:transform}
.tilt:hover{box-shadow:var(--sh-2);border-color:var(--rule-2)}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
background:radial-gradient(420px circle at var(--gx,50%) var(--gy,50%),var(--glow),transparent 45%);transition:opacity .25s}
.tilt:hover::after{opacity:1}

/* main finding */
.finding{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-top:22px}
.hero{position:relative;padding:20px 22px;overflow:hidden}
.hero.is-root{border-color:color-mix(in srgb,var(--red) 30%,var(--rule))}
.hero.is-root::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
background:linear-gradient(var(--red),color-mix(in srgb,var(--red) 30%,transparent))}
.hero .label{display:flex;align-items:center;gap:7px}
svg.lab-ic{width:15px;height:15px;color:var(--red)}
.entry{margin:10px 0 8px;font-size:1.12rem;line-height:1.45;font-weight:500;overflow-wrap:anywhere}
.entry .n{font:600 .9rem var(--mono);color:var(--red);background:var(--red-soft);padding:2px 7px;border-radius:6px;
margin-right:8px;text-decoration:none}
.entry .when{font:.82rem var(--mono);color:var(--muted);margin-right:8px}
.entry-sub{margin:0;color:var(--ink-2);font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{position:relative;padding:14px 16px;overflow:hidden}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
svg.kpi-ic{width:28px;height:28px;padding:6px;border-radius:8px;color:var(--accent);background:var(--accent-soft)}
.kpi-val{font-size:1.75rem;font-weight:650;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* confidence */
.meter{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;white-space:nowrap;color:var(--ink-2)}
.meter i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.c-high i{background:var(--high);box-shadow:0 0 0 3px color-mix(in srgb,var(--high) 18%,transparent)}
.c-medium i{background:var(--medium);box-shadow:0 0 0 3px color-mix(in srgb,var(--medium) 18%,transparent)}
.c-low i{background:var(--low);box-shadow:0 0 0 3px color-mix(in srgb,var(--low) 18%,transparent)}

/* sections */
.stage{margin-top:24px}
.sheet{padding:20px 24px;margin-bottom:16px}
section.doc h2{font-size:1.05rem;font-weight:650;margin:0 0 12px;letter-spacing:-.01em}
section.doc h3{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
section.doc p,section.doc ul{margin:6px 0}
section.doc ul{padding-left:20px}
section.doc li{margin:4px 0;overflow-wrap:anywhere}
section.doc li::marker{color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{font-weight:600;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;
padding:9px 10px;border-bottom:1px solid var(--rule-2);background:var(--surface-2)}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top;overflow-wrap:anywhere}
tr.hl td{background:var(--red-soft)}
td.mark-root{font-weight:600}
dl.fields{display:grid;grid-template-columns:max-content 1fr;gap:7px 28px;margin:8px 0}
dl.fields dt{color:var(--muted);font-size:.84rem}
dl.fields dd{margin:0;overflow-wrap:anywhere}
pre{font:.79rem/1.6 var(--mono);background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;
padding:10px 12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}

/* timeline */
.tl{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.tl>div:first-child{min-width:0}
.chart{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--sh-1);padding:18px 20px}
.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.chart-head h2{font-size:1rem;font-weight:650;margin:0}
.hint{color:var(--muted);font-size:.84rem;margin:2px 0 12px}
.chart svg{display:block;width:100%;touch-action:none;user-select:none}
.chart .lane{font:11px var(--mono);fill:var(--muted)}
.chart .lane.att{fill:var(--ink);font-weight:600}
.chart .axis{font:10px var(--mono);fill:var(--muted)}
.chart .base{stroke:var(--rule);stroke-width:1}
.chart .tick{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 3}
.chart .gapband{fill:var(--gap)}
.chart .hatchline{stroke:none}
.chart .gaplabel{font:9px var(--mono);fill:var(--muted)}
.chart .ev{cursor:pointer;transition:filter .15s}
.chart .ev:hover{filter:drop-shadow(0 0 4px var(--accent))}
.chart .ev.sel{stroke:var(--accent);stroke-width:2.5}
.chart .rootline{stroke:var(--red);stroke-width:1.2;stroke-dasharray:3 3}
.chart .roottagbg{fill:var(--red-soft)}
.chart .roottag{font:600 10px var(--mono);fill:var(--red)}
.chart .brush{fill:var(--accent);opacity:.1}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.btn{border:1px solid var(--rule-2);background:var(--surface);border-radius:7px;padding:3px 11px;cursor:pointer;
font-size:.8rem;white-space:nowrap;flex-shrink:0;color:var(--ink-2);transition:all .15s;box-shadow:var(--sh-1)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}

/* glyphs: a shape per kind, so colour is never the only cue */
.g{display:inline-block;width:9px;height:9px;flex-shrink:0}
.g-recon{border:1.5px solid var(--c-recon);border-radius:50%}
.g-exploit{background:var(--c-exploit);clip-path:polygon(50% 0,100% 100%,0 100%)}
.g-login{background:var(--c-login);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.g-write{background:var(--c-write);border-radius:1px}
.g-file{border:1.5px solid var(--c-file);border-radius:1px}
.g-use{background:var(--c-use);border-radius:50%}
.g-other{background:var(--c-other);width:5px;height:5px;margin:2px}

/* filters + register, joined into one panel */
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:16px;padding:12px 14px;
background:var(--surface);border:1px solid var(--rule);border-bottom:0;border-radius:12px 12px 0 0}
.filters input[type=search]{flex:1 1 220px;min-width:0;padding:7px 11px;border:1px solid var(--rule-2);
border-radius:8px;background:var(--surface-2);transition:border-color .15s,box-shadow .15s}
.filters input[type=search]:focus,.filters select:focus{outline:0;border-color:var(--accent);
box-shadow:0 0 0 3px var(--accent-soft)}
.filters select{padding:7px 9px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface-2);max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface-2);
padding:3px 10px;border-radius:999px;cursor:pointer;font-size:.78rem;color:var(--ink-2);transition:opacity .15s,border-color .15s}
.chip:hover{border-color:var(--rule-2)}
.chip[aria-pressed="false"]{opacity:.4}
.toggle{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--ink-2)}
.toggle input{accent-color:var(--accent)}
.count{color:var(--muted);font-size:.78rem;margin-left:auto}
.reg-head,ol.events li{display:grid;grid-template-columns:50px 74px 124px minmax(0,1fr) 86px;gap:12px;align-items:baseline}
.reg-head{padding:9px 14px;background:var(--surface-2);border:1px solid var(--rule)}
ol.events{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-top:0;
border-radius:0 0 12px 12px;overflow:hidden;box-shadow:var(--sh-1)}
ol.events li{padding:10px 14px;border-top:1px solid var(--rule);cursor:pointer;font-size:.88rem;
transition:background .12s}
ol.events li:first-child{border-top:0}
ol.events li:hover{background:var(--surface-2)}
ol.events li.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
ol.events li.root{box-shadow:inset 3px 0 0 var(--red)}
ol.events li.root.sel{background:var(--sel)}
ol.events li.day{display:block;cursor:default;padding:12px 14px 6px;font-size:.72rem;font-weight:600;
letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
ol.events li.sub{font-size:.84rem;background:var(--surface-2)}
ol.events li.sub .n{padding-left:10px}
ol.events li.runrow .text{color:var(--ink-2)}
ol.events .n{font:.78rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
ol.events li.root .n{color:var(--red);font-weight:600}
ol.events .time{font:.8rem var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
ol.events .actor{font:.78rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
ol.events .text{display:flex;gap:9px;align-items:baseline;overflow-wrap:anywhere;min-width:0}
ol.events .tag{font-size:.7rem;font-weight:700;color:var(--red);background:var(--red-soft);padding:1px 6px;
border-radius:5px;margin-right:6px;letter-spacing:.03em}
ol.events li.empty{display:block;cursor:default;color:var(--muted);text-align:center;padding:28px}
.more{margin:14px 0;text-align:center}

/* evidence sheet */
.detail{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);
border:1px solid var(--rule);border-radius:12px;box-shadow:var(--sh-2);padding:0 0 18px}
.detail .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:16px 18px 12px;
border-bottom:1px solid var(--rule);background:linear-gradient(var(--surface-2),var(--surface))}
.detail .head .no{font:650 1.25rem var(--mono);margin-top:2px;letter-spacing:-.01em}
.detail .body{padding:0 18px}
.detail .rootnote{display:inline-block;font-size:.72rem;font-weight:700;color:var(--red);background:var(--red-soft);
padding:2px 8px;border-radius:5px;margin-top:14px;letter-spacing:.03em}
.detail .text{margin:12px 0 14px;font-size:.98rem;line-height:1.5;font-weight:500;overflow-wrap:anywhere}
.detail .text .g{margin-right:4px}
.detail dl.fields{grid-template-columns:96px 1fr;font-size:.85rem}
.detail h3{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.detail ul{margin:0;padding-left:18px;font-size:.86rem;color:var(--ink-2)}
.detail li{margin:4px 0}
.cite{margin:10px 0;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.cite .ref{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;
background:var(--surface-2);border-bottom:1px solid var(--rule);font:.76rem var(--mono);color:var(--ink-2);overflow-wrap:anywhere}
.cite pre{margin:0;border:0;border-radius:0;background:var(--surface)}
.detail .empty{color:var(--muted);margin:16px 18px;font-size:.88rem}
.detail .close{display:none}
footer{color:var(--muted);font-size:.76rem;margin-top:40px;padding-top:14px;border-top:1px solid var(--rule)}

/* attack flow */
ol.flow{list-style:none;margin:6px 0 0;padding:0;max-width:740px}
.flow-node{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:13px 16px;box-shadow:var(--sh-1)}
.flow-node[role=button]{cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s}
.flow-node[role=button]:hover,.flow-node[role=button]:focus-visible{border-color:var(--accent);box-shadow:var(--sh-2);
transform:translateY(-2px);outline:none}
.flow-node.actor{background:var(--surface-2);border-style:dashed;box-shadow:none}
.flow-actor{font:600 .95rem var(--mono);margin-top:3px}
.flow-node.root{border-color:color-mix(in srgb,var(--red) 40%,var(--rule));box-shadow:inset 3px 0 0 var(--red),var(--sh-1)}
.flow-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:.76rem var(--mono);color:var(--muted)}
.flow-meta .n{color:var(--ink-2);font-weight:600}
.flow-node.root .flow-meta .n{color:var(--red)}
.flow-meta .tag{font:700 .68rem var(--sans);color:var(--red);background:var(--red-soft);padding:1px 6px;border-radius:5px}
.flow-text{margin:6px 0 5px;font-weight:500;overflow-wrap:anywhere}
.flow-foot{display:flex;justify-content:space-between;gap:12px;font:.76rem var(--mono);color:var(--muted)}
.flow-link{position:relative;height:42px;margin-left:30px;border-left:2px solid var(--rule-2)}
.flow-link::after{content:"";position:absolute;left:-6px;bottom:-1px;border:5px solid transparent;
border-top:7px solid var(--rule-2);border-bottom:0}
.flow-link span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.74rem;font-weight:600;
color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px}

/* 3D space */
.space-box{position:relative;border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:var(--sh-1);
background:radial-gradient(ellipse at 50% 55%,var(--surface),var(--surface-2) 75%)}
canvas.space{display:block;width:100%;height:420px;cursor:grab;touch-action:none}
canvas.space:active{cursor:grabbing}
.space-tip{position:absolute;max-width:300px;pointer-events:none;background:var(--ink);color:var(--bg);
font:.75rem/1.45 var(--mono);padding:7px 10px;border-radius:8px;white-space:pre-wrap;box-shadow:var(--sh-2)}
[role=tabpanel]>.chart-head{margin-bottom:2px}

/* motion: short, once, and only while the script holds the class */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes slide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

        tip.textContent = no(it.q.e.n) + "  " + it.q.e.clock + "  " + (it.q.e.actor || U["chart.files"]) +
          "\n" + it.q.e.text;
        tip.style.left = Math.max(0, Math.min(it.p.x + 14, b.width - 300)) + "px";
        tip.style.top = (it.p.y + 12) + "px";
      } else { tip.hidden = true; }
      if (!running) draw();
    });
    canvas.addEventListener("pointerup", function (ev) {
      var wasDrag = moved;
      drag = null;
      if (!wasDrag) { var it = pick(ev); if (it) openEvent(it.q.e.n); }
    });
    canvas.addEventListener("pointerleave", function () { hover = null; tip.hidden = true; if (!running) draw(); });
    canvas.addEventListener("wheel", function (ev) {
      ev.preventDefault(); auto = false;
      cam.dist = Math.max(2.2, Math.min(7, cam.dist * (ev.deltaY > 0 ? 1.08 : 0.93)));
      if (!running) draw();
    }, { passive: false });

    return {
      start: function () {
        if (running) return;
        if (REDUCED) { draw(); return; }
        running = true; loop();
      },
      stop: function () { running = false; cancelAnimationFrame(raf); }
    };
  }

  function copy(text, btn) {
    function done() { btn.textContent = U.copied; setTimeout(function () { btn.textContent = U.copy; }, 1200); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text); done(); });
    } else { fallback(text); done(); }
  }

  function fallback(text) {
    var area = el("textarea", { readonly: true, style: "position:fixed;opacity:0" });
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); } catch (err) { /* nothing else to try offline */ }
    document.body.removeChild(area);
  }

  showTab(location.hash.slice(1) || "overview", false);
})();
</script>
